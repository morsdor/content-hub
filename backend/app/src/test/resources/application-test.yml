spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Static public key removes the network dependency on a JWK endpoint.
          # Tests that need to call authenticated endpoints should sign JWTs with the
          # matching private key (generate on demand with JWKs or use spring-security-test).
          public-key-location: classpath:test-public.pem

outbox:
  relay:
    enabled: false

logging:
  level:
    com.contenthub: DEBUG
    org.testcontainers: WARN
    org.flywaydb: INFO
